# 학생 서버 앞단 로드밸런서 (PRD v0.15 §9.1 — 학생 서버는 인스턴스 2개 이상 + LB).
#
# 측정용 구성이다. 수치를 왜곡하지 않도록 두 가지를 해 둔다:
#   - access_log off: 요청마다 디스크에 쓰면 p95 가 디스크 상태에 끌려간다
#   - keepalive: 커넥션을 재사용하지 않으면 150 VU 에서 TIME_WAIT 가 쌓여
#     측정 대상(앱)이 아니라 커널 소켓 고갈을 재게 된다

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;
    sendfile on;
    tcp_nodelay on;

    upstream student_api {
        # least_conn: 조회마다 처리 시간이 다르다(캐시 적중/불발). round-robin 이면
        # 느린 요청이 몰린 인스턴스에 계속 보내게 된다
        least_conn;
        server student-api-1:8001 max_fails=3 fail_timeout=5s;
        server student-api-2:8001 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 8001;

        # 인스턴스가 몇 번인지 응답에 남긴다 — 분배가 실제로 되는지 눈으로 확인한다
        add_header X-Upstream $upstream_addr always;

        location / {
            proxy_pass http://student_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 한 인스턴스가 죽었을 때 빨리 다음으로 넘어간다. 느리게 잡으면
            # 장애 인스턴스 때문에 p95 가 통째로 무너진다
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
